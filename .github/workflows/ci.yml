name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Financial unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Browser and accessibility tests
        run: pnpm exec playwright test --reporter=line,github
      - run: pnpm test:coverage
      - run: pnpm package
      - run: pnpm audit --prod
      - name: Generate package checksums
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS
      - name: Save downloadable testing packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-testing-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Explain installation
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Download this testing build
          Download the `extension-testing-...` artifact at the bottom of this run page.
          Extract that download, then extract the extension ZIP (the one without `source` in its name).
          In Chrome, open `chrome://extensions`, enable Developer mode, and choose **Load unpacked**.
          Select the extracted folder containing `manifest.json`.

          This is a prerelease testing build. Publication readiness checks still apply.
          EOF
