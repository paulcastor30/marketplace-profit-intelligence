name: Release review artifact
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: node scripts/release-check.mjs
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check && pnpm test:coverage && pnpm package
      - name: Check tag and manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const p=require('./package.json'); const m=require('./public/manifest.json'); if(process.env.RELEASE_TAG!=='v'+p.version || p.version!==m.version)process.exit(1)"
      - run: sha256sum artifacts/*.zip > artifacts/SHA256SUMS
      - name: Publish GitHub release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/*.zip artifacts/SHA256SUMS --verify-tag --notes-file CHANGELOG.md
